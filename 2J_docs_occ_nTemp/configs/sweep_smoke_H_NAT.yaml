# sweep_smoke_H_NAT.yaml — smoke run for H_NAT (5 epochs, small model, --sample)
# Cloned from H_NAT.yaml. --sample in job script overrides d_model/epochs.
# Pass criterion: 5 epochs complete, no NaN, val_score < 1.30 (G4 baseline 1.48)
tag: H_NAT_smoke
seed: 42
model_type: H_NAT

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 5
patience: 5
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6

d_ff: 1536
refinement_layers: 2
n_activity_classes: 14

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
