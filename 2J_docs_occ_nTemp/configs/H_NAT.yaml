# H_NAT.yaml — H-series Tier-3: Encoder-only (non-AR) bidirectional refinement
# Architecture: 6-layer encoder (G4 base) + 2-layer bidirectional refinement + parallel heads
# No AR loop, no BOS token, no causal mask. Single forward pass at inference.
# Base: G4 (d_model=384, n_enc_layers=6, n_heads=8, d_ff=1536, dropout=0.1)
# lambda_home: 0.7 (match H_Tanh, NOT G4 0.6 — confounder control)
# Hard gates: composite < 1.045 | AT_HOME <= 5.3 pp | Spouse <= 5 pp | act_JS <= 0.05
tag: H_NAT
seed: 42
model_type: H_NAT

# Argparse flags (G4 base, no n_dec_layers — H_NAT has no causal decoder)
data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6

# Architecture
d_ff: 1536
refinement_layers: 2
n_activity_classes: 14

# Loss weights — lambda_home=0.7 matches H_Tanh (confounder control)
lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

# Feature switches (G4 base; aux_stratum_head disabled — no decoder layer-0)
aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
