# I1.yaml — I-series: faithful encoder-only port of Transformer_pipeline.py
# Architecture: per-slot fusion (tod+dow+sidx+act+cond_vec+cycle+strata_oh) →
#   project → learnable PE → single TransformerEncoder → Tanh-gated binary heads.
# Training: no fp16, clip_grad_norm 25, ReduceLROnPlateau(factor=0.95, patience=5).
# Locked: lambda_home=0.6 (G4 AT_HOME recipe), Spouse masked loss (p(spouse|home)).
# Hard gates: composite < 1.045 | AT_HOME ≤ 5.3 pp | Spouse ≤ 5 pp | act_JS ≤ 0.05
tag: I1
seed: 42
model_type: I1

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.6
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 1.0
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.0
