# J3_HPT_L.yaml — J3 baseline + lambda_home: 0.9 -> 1.1 (single axis)
# HPT-L variant: push AT_HOME RMS lower by strengthening home BCE signal.
# All other knobs match J3's true config (per CSV records: lambda_home=0.9 baseline,
# not 0.7 as the stale local J3.yaml shows). Architecture J3 byte-for-byte.
# Hard gates: composite < 0.6355 | AT_HOME RMS <= 4.0 pp | Spouse <= 2 pp | act_JS <= 0.022
tag: J3_HPT_L
seed: 42
model_type: J3

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 1.1
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
