# J5_F.yaml — Joint encoder supervision + AR decoder for activity only (2026-05-20).
# Topology fix for 2026-05-20 diagnosis: encoder shaped jointly by all three losses;
# Arm-2 fusion + .detach() barrier dropped. AR decoder kept for activity prediction.
# Targets the 187x supervision-capacity asymmetry that locked AT_HOME / Spouse residual.
# Hard gates: composite < 0.6000 | AT_HOME RMS <= 4.0 pp | Spouse <= 2.0 pp | act_JS <= 0.022
tag: J5_F
seed: 42
model_type: J5_F

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 0.5
lambda_home: 0.9
lambda_cop: 0.5
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
