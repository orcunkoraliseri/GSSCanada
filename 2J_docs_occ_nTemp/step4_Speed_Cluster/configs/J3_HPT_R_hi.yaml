# J3_HPT_R_hi.yaml — J3 baseline + lr: 5e-5 -> 7e-5 (single axis)
# HPT-R_hi variant: higher LR for faster initial convergence.
# Architecture J3 byte-for-byte. Bracketed with R_lo (3e-5).
# ReduceLROnPlateau factor (0.95) and patience (5) held constant; only base LR changes.
# Hard gates: composite < 0.6355 | AT_HOME RMS <= 4.0 pp | Spouse <= 2 pp | act_JS <= 0.022
tag: J3_HPT_R_hi
seed: 42
model_type: J3

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 7.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.9
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
