# H6.yaml — H-series Tier-1: disable manual activity CE boosts
# Axis: ACTIVITY_BOOSTS=0 removes Work x5 / Transit x3 / Social x2 multipliers.
# Change from G4: activity_boosts: 0
# All other config identical to G4.
tag: H6
seed: 42

# Argparse flags (G4 base)
data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

# Architecture
d_ff: 1536

# H6 axis
activity_boosts: 0

# Loss weights (G4 base)
lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

# Feature switches (G4 base)
aux_stratum_head: 1
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
