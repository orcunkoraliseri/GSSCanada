# H4.yaml — H-series Tier-1: equal-weight all loss terms
# Axis: LAMBDA_ALL_EQUAL=1 normalises [ACT, HOME, COP, MARG] to 0.25 each.
# Change from G4: lambda_all_equal: 1 (overrides per-axis lambda values at module load)
# All other config identical to G4.
tag: H4
seed: 42

# Argparse flags (G4 base)
data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

# Architecture
d_ff: 1536

# H4 axis
lambda_all_equal: 1

# Loss weights (G4 base — normalised to 0.25 each at runtime by LAMBDA_ALL_EQUAL)
lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

# Feature switches (G4 base)
aux_stratum_head: 1
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
