# J_old.yaml — Pure encoder-only revert (mirrors Transformer_pipeline.py:556-558 + :777).
# Three parallel Linear heads off encoder slots. No AR decoder. No Arm-2 fusion.
# Tests "is the AR decoder doing real work at 48-slot resolution?" Lambdas match J5_F.
# Hard gates: composite < 0.6000 | AT_HOME RMS <= 4.0 pp | Spouse <= 2.0 pp
# Secondary (diagnostic): act_JS — if <= 0.025, AR decoder unnecessary at 48-slot.
tag: J_old
seed: 42
model_type: J_old

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 0.5
lambda_home: 0.9
lambda_cop: 0.5
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
