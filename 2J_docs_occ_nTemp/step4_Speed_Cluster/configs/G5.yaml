# G5.yaml — G-series stage 5: bump lambda_home to close AT_HOME gap
# Change from G4: lambda_home 0.6 -> 0.7 (close 0.357 pp AT_HOME miss)
# G4 result: AT_HOME=5.657 pp (gate <=5.3 pp, miss 0.357 pp); G4 lambda_home bump 0.5->0.6 closed 0.401 pp
# All other config unchanged from G4.
tag: G5
seed: 42

# Argparse flags (G4 base)
data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

# Architecture (unchanged from G3/G4 — CrossAttnDecoder)
d_ff: 1536

# Loss weights — lambda_home bumped further to close AT_HOME gap
lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

# Feature switches (unchanged from G4)
aux_stratum_head: 1
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0

# G4/G5: sched_sample_p=0.0 (no scheduled sampling)
sched_sample_p: 0.0
home_label_smooth: 0.05
