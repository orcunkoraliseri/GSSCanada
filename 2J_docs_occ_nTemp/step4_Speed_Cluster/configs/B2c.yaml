# B2c.yaml — Phase 8B-3 V3: G4_NAT_COP_SG — soft continuous home gate
# Single-axis fix over B2: cop_head input d_model+1 (appends continuous home_prob per slot).
# Inference uses sigmoid (not binary threshold) for home; removes hard Spouse multiply.
tag: B2c
model_type: G4_NAT_COP_SG
seed: 42

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6
d_ff: 1536

lambda_act: 1.0
lambda_home: 0.6
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
