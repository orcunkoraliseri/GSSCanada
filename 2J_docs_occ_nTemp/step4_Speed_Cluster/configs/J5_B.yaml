# J5_B.yaml — J5-B hierarchical chain-rule cop head experiment.
# JSeriesHybrid build identical to J3 (arm2_act_proj path); chain rule applied in compute_loss + infer
# (J5_B branches in 04D_train.py and 04B_model.py). Inference safety mask dropped — chain rule subsumes it.
# Attacks 2005/2010 Alone +21/+17 pp residual by structurally restricting the 9-channel cop output space.
# Hard gates: composite < 1.045 | AT_HOME RMS <= 5.30 pp | Spouse <= 5 pp | act_JS <= 0.05
# Targets: cop_max_gap (Alone) toward <= 3.5 pp; act_JS hold; AT_HOME hold.
tag: J5_B
seed: 42
model_type: J5_B

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
