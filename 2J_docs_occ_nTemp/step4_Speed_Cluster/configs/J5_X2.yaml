# J5_X2.yaml — J5-X2 config fix for J5-X1's act_JS regression.
# Reuses J5_X1 model branch (dec_output.detach() route) byte-for-byte; ONLY lambda_home differs.
# Hypothesis: J5-X1 act_JS=0.0311 (vs J3's 0.0191) is config-driven via early-stop timing shift;
# restoring lambda_home=0.9 should converge to J3-level act_JS while preserving J5-X1's
# AT_HOME RMS gain (4.15 pp).
# Hard gates: composite < 1.045 | AT_HOME RMS <= 5.30 pp | Spouse <= 5 pp | act_JS <= 0.05
# Targets: act_JS <= 0.022 | AT_HOME RMS <= 4.15 pp | composite < 0.6355
tag: J5_X2
seed: 42
model_type: J5_X1

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.9
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
