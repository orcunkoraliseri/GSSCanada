# J5_A.yaml — J5-A label-smoothing drop experiment (home_label_smooth: 0.05 -> 0.0).
# Inherits J3.yaml byte-for-byte; ONLY home_label_smooth differs. JSeriesHybrid build identical to J3.
# Attacks home_head sigma=0.0 collapse via removing the ε=0.05 BCE floor (0.198 algebraic floor -> 0).
# Hard gates: composite < 1.045 | AT_HOME RMS <= 5.30 pp | Spouse <= 5 pp | act_JS <= 0.05
# Targets: AT_HOME RMS toward 3.0–3.8 pp; composite < 0.6355; act_JS hold (Arm 1 unaffected).
tag: J5_A
seed: 42
model_type: J5_A

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.0
