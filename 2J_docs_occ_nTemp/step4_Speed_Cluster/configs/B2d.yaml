# B2d.yaml — Phase 8B-3 V4: G4_NAT_COP_NATH — AT_HOME moved to NAT Arm-2 (J3 wiring)
# Single-axis fix over B2: AR decoder activity-only; home_head reads arm2_feat (parallel to COP).
# Directly targets both AT_HOME gate failure and biased-home→COP coupling.
tag: B2d
model_type: G4_NAT_COP_NATH
seed: 42

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6
d_ff: 1536

lambda_act: 1.0
lambda_home: 0.6
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
