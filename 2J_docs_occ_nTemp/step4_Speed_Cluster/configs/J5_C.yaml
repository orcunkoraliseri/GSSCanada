# J5_C.yaml — Linear-chain CRF + Viterbi on Arm-1 activity logits (2026-05-20 bundle).
# J3 architecture preserved; psi_pair (14x14) added on Arm-1 unaries. Forward-backward NLL
# replaces per-slot CE at training; Viterbi replaces argmax at inference.
# Tests the "transition rate ratio = 157.95x" residual (P4 §7 Path 1 / P7 §1 stage 2).
# Hard gates: composite < 0.6355 | AT_HOME RMS <= 5.30 pp | Spouse <= 5 pp | act_JS <= 0.05
tag: J5_C
seed: 42
model_type: J5_C

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
