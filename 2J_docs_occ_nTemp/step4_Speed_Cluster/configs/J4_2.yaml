# J4_2.yaml — J-4.2 Hierarchical State Dependency (home → cop, single axis vs J3)
# cop_head input widened d_model → d_model+1; home_probs.detach() prepended at forward/infer.
# enable_temporal_injection NOT set — J-4.2 does not carry J-4.1's axis.
# All lambdas, lr, scheduler, epochs, dropout, seed inherited byte-for-byte from J3.
tag: J4_2
seed: 42
model_type: J4_2
enable_hierarchical_cop: true

data_dir: outputs_step4_G1
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
