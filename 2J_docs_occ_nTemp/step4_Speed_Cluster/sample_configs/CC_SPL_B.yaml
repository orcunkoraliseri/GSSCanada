# CC_SPL_B.yaml — Phase 6 Stage B Trial 2: CC + Semantic Probabilistic Layer.
# Soft logic constraints: ¬home ⇒ ¬alone, work ⇒ ¬home ∧ colleagues, sleep ⇒ home.
# 20% stratified sample (~30k respondents), 100 epoch cap, patience 15.
tag: CC_SPL_B
seed: 42
model_type: J3

data_dir: outputs_step4_G2_sample20
sample_frac: 0.20
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6
d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global
aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05

use_film: 1
use_fourier_pe: 1
use_prefix: 1
use_spl: 1
use_fact: 0
loss_mode: ce
