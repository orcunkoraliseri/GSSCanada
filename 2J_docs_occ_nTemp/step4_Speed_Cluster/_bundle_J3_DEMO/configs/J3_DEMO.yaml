# J3_DEMO.yaml — Arm 1 of Phase 2 (Lever A only): stock J3 + restored demographics.
# Architecture identical to J3 baseline (composite 0.6355). The single change is the
# input tensor bundle: outputs_step4_G2 (d_cond=90) replaces outputs_step4_G1 (d_cond=76)
# because Step 1+2+3 plumbing now propagates ATTSCH/POWST/MODE end-to-end. See
# 04_augmentationGSS_IMP.md §3 Lever A and Progress Log entries 2026-05-22.
# Tests whether restored GSS demographics alone close the 2022-Weekday AT_HOME cell
# (9.69 pp gap) and Spouse Δ (2.03 pp) without any architectural change.
# Hard gates: composite < 1.045 | AT_HOME <= 5.3 pp | Spouse <= 5 pp | act_JS <= 0.05
tag: J3_DEMO
seed: 42
model_type: J3

data_dir: outputs_step4_G2
batch_size: 256
max_epochs: 100
patience: 15
lr: 5.0e-5
d_model: 384
n_heads: 8
n_enc_layers: 6
n_dec_layers: 6

d_ff: 1536

lambda_act: 1.0
lambda_home: 0.7
lambda_cop: 0.3
lambda_marg: 0.1
marg_mode: global

aux_stratum_head: 0
aux_stratum_lambda: 0.1
spouse_neg_weight: 0.45
cop_pos_weight: 0
activity_boosts: 1
data_side_sampling: 0
sched_sample_p: 0.0
home_label_smooth: 0.05
